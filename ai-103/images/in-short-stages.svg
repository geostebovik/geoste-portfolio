<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="680" height="344" role="img" aria-label="Two-part diagram. Part 1: an AI agent takes a topic and image, writes title and text, checks the text against a fact sheet, audits the image and reports pass or fail. Part 2: the same agent runs in Azure: upload, queue, Azure Function runs the agent, result saved, sign in to view." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .part { font-family: Syne, sans-serif; font-weight: 700; font-size: 13px; fill: #e8e6e1; letter-spacing: .02em; }
  .sub  { font-family: Syne, sans-serif; font-size: 11px; fill: #9aa0a6; }
  .lbl  { font-family: Syne, sans-serif; font-weight: 600; font-size: 11px; fill: #e8e6e1; }
  .note { font-family: Syne, sans-serif; font-size: 11px; }
  .foot { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; fill: #9aa0a6; }
</style>
<rect width="680" height="344" fill="#0e0f11"/>
<text x="20" y="30" class="part">PART 1 · Build an agent that checks its own work</text>
<text x="20" y="45" class="sub">on a developer's machine, tested against a written answer key</text>
<rect x="20" y="56" width="112" height="58" rx="6" fill="#16181c" stroke="#9ca3af" stroke-width="1.5"/>
<text x="76.0" y="82.0" text-anchor="middle" class="lbl">Topic +</text>
<text x="76.0" y="96.0" text-anchor="middle" class="lbl">image in</text>
<line x1="135" y1="85.0" x2="144" y2="85.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M143,81.0 L149,85.0 L143,89.0 Z" fill="#9aa0a6"/>
<rect x="152" y="56" width="112" height="58" rx="6" fill="#16181c" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="208.0" y="82.0" text-anchor="middle" class="lbl">Agent writes</text>
<text x="208.0" y="96.0" text-anchor="middle" class="lbl">title + text</text>
<line x1="267" y1="85.0" x2="276" y2="85.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M275,81.0 L281,85.0 L275,89.0 Z" fill="#9aa0a6"/>
<rect x="284" y="56" width="112" height="58" rx="6" fill="#16181c" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="340.0" y="82.0" text-anchor="middle" class="lbl">Checks text</text>
<text x="340.0" y="96.0" text-anchor="middle" class="lbl">vs fact sheet</text>
<line x1="399" y1="85.0" x2="408" y2="85.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M407,81.0 L413,85.0 L407,89.0 Z" fill="#9aa0a6"/>
<rect x="416" y="56" width="112" height="58" rx="6" fill="#16181c" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="472.0" y="82.0" text-anchor="middle" class="lbl">Audits</text>
<text x="472.0" y="96.0" text-anchor="middle" class="lbl">the image</text>
<line x1="531" y1="85.0" x2="540" y2="85.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M539,81.0 L545,85.0 L539,89.0 Z" fill="#9aa0a6"/>
<rect x="548" y="56" width="112" height="58" rx="6" fill="#16181c" stroke="#9ca3af" stroke-width="1.5"/>
<text x="604.0" y="82.0" text-anchor="middle" class="lbl">Reports</text>
<text x="604.0" y="96.0" text-anchor="middle" class="lbl">pass / fail</text>
<line x1="340.0" y1="118" x2="340.0" y2="194" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 4"/><text x="348.0" y="147.0" class="note" fill="#2dd4bf">same agent</text>
<text x="20" y="172" class="part">PART 2 · Run it as a secure app in Azure</text>
<text x="20" y="187" class="sub">no keys or passwords in the code; sign-in required to see results</text>
<rect x="20" y="198" width="112" height="58" rx="6" fill="#16181c" stroke="#9ca3af" stroke-width="1.5"/>
<text x="76.0" y="224.0" text-anchor="middle" class="lbl">Upload</text>
<text x="76.0" y="238.0" text-anchor="middle" class="lbl">image + topic</text>
<line x1="135" y1="227.0" x2="144" y2="227.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M143,223.0 L149,227.0 L143,231.0 Z" fill="#9aa0a6"/>
<rect x="152" y="198" width="112" height="58" rx="6" fill="#16181c" stroke="#9ca3af" stroke-width="1.5"/>
<text x="208.0" y="224.0" text-anchor="middle" class="lbl">Queued in</text>
<text x="208.0" y="238.0" text-anchor="middle" class="lbl">Azure Storage</text>
<line x1="267" y1="227.0" x2="276" y2="227.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M275,223.0 L281,227.0 L275,231.0 Z" fill="#9aa0a6"/>
<rect x="284" y="198" width="112" height="58" rx="6" fill="#16181c" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="340.0" y="224.0" text-anchor="middle" class="lbl">Azure Function</text>
<text x="340.0" y="238.0" text-anchor="middle" class="lbl">runs the agent</text>
<line x1="399" y1="227.0" x2="408" y2="227.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M407,223.0 L413,227.0 L407,231.0 Z" fill="#9aa0a6"/>
<rect x="416" y="198" width="112" height="58" rx="6" fill="#16181c" stroke="#9ca3af" stroke-width="1.5"/>
<text x="472.0" y="224.0" text-anchor="middle" class="lbl">Result</text>
<text x="472.0" y="238.0" text-anchor="middle" class="lbl">saved</text>
<line x1="531" y1="227.0" x2="540" y2="227.0" stroke="#9aa0a6" stroke-width="1.5"/><path d="M539,223.0 L545,227.0 L539,231.0 Z" fill="#9aa0a6"/>
<rect x="548" y="198" width="112" height="58" rx="6" fill="#16181c" stroke="#a78bfa" stroke-width="1.5"/>
<text x="604.0" y="224.0" text-anchor="middle" class="lbl">Sign in</text>
<text x="604.0" y="238.0" text-anchor="middle" class="lbl">to view</text>
<rect x="20" y="274" width="640" height="30" rx="6" fill="#16181c" stroke="#1e2128"/><text x="340.0" y="293" text-anchor="middle" class="note"><tspan fill="#9aa0a6">Around it: </tspan><tspan fill="#fb7185">email alert when an upload fails</tspan><tspan fill="#9aa0a6"> · </tspan><tspan fill="#fbbf24">deploys from GitHub</tspan><tspan fill="#9aa0a6"> · </tspan><tspan fill="#2dd4bf">each upload traced</tspan></text>
<text x="660" y="330" text-anchor="end" class="foot">ostebovik.net · AI-103 Phase 2</text>
</svg>
